default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Format yaml files
      - id: check-yaml
        # Ignore conda build meta.yaml files
        exclude: ^scripts/conda-build/meta.*\.yaml$
      # Fix end-of-file issues
      - id: end-of-file-fixer
      # Fix trailing whitespace
      - id: trailing-whitespace
      # Prevent debug statements
      - id: debug-statements
      #- id: fix-encoding-pragma
      - id: mixed-line-ending

# This was recommended but seems very opinionated.
#- repo: https://github.com/asottile/pyupgrade
#  rev: v3.20.0
#  hooks:
#    - id: pyupgrade
#      args: [--py310-plus]

  # Use the project's locked Ruff version and configuration, as in CI.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check
        language: system
        files: ^(src|tests)/.*\.pyi?$
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        files: ^(src|tests)/.*\.pyi?$
        require_serial: true

  # Remove metadata from jupyter notebooks. This will always be triggered when you commit a change in a notebook.
  - repo: local
    hooks:
      - id: nbstripout
        name: nbstripout with keep-output
        entry: |
          python -m nbstripout --keep-output $@
        language: system
        files: \.ipynb$
        exclude: tests/
