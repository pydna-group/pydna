[project]
authors = [
  { name = "Björn F. Johansson", email = "bjornjobb@gmail.com" },
  { name = "Manuel Lera-Ramirez", email = "manulera14@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# description = "Representing double stranded DNA and functions for simulating cloning and homologous recombination between DNA molecules."
dynamic = ["version"]
name = "pydna"
readme = "README.md"
license-files = ["LICENSE.txt"]
dependencies = [
  "appdirs>=1.4.4",
  "biopython>=1.87,<2.0",
  "networkx>=2.8.8",
  "numpy>1.26; python_version < '3.12'",
  "numpy>=2.3.0; python_version >= '3.12'",
  "prettytable>=3.5.0",
  "pydivsufsort>=0.0.20,<0.0.21",
  "pyfiglet>=0.8.post1",
  "seguid>=0.0.5",
  "regex>=2024.11.6,<2027.0.0",
  "opencloning-linkml>=1,<2",
  "sgffp>=0.18.0",
]

[project.optional-dependencies]
clipboard = ["pyperclip>=1.8.2"]
download = ["pyparsing>=2.4.7", "requests>=2.26.0"]
express = ["cai2>=1.0.5"]
gel = [
  "scipy>=1.11.3; python_version >= '3.12'",
  "scipy>=1.9.3; python_version < '3.12'",
  "matplotlib>=3.4.3",
  "pillow>=8.4.0",
]
primer_screen = ["pyahocorasick>=2.2.0"]

[dependency-groups]
test = [
  "coverage>=7.1.0",
  "nbval>=0.9.6",
  "pytest>=7.2.0",
  "pytest-cov>=4.0.0",
  "pytest-doctestplus>=0.12.1",
  "pytest-profiling>=1.7.0",
  "requests-mock>=1.10.0",
]
docs = [
  "numpydoc>=1.6.0,<2.0",
  "sphinx",
  "myst-nb",
  "sphinx-book-theme",
  "pandas",
]
dev = [
  "autopep8>=2.1.0,<3.0",
  "black>=25.1,<27.0",
  "pre-commit>3.6",
  "nbstripout>=0.9,<0.10",
  "flake8-bugbear>=24.12.12",
]

[tool.poetry.urls]
Changelog = "https://github.com/pydna-group/pydna/blob/master/docs/CHANGELOG.md#changelog"
[tool.poetry]
description = "Representing double stranded DNA and functions for simulating cloning and homologous recombination between DNA molecules."
authors = [
  "Björn F. Johansson <bjornjobb@gmail.com>",
  "Manuel Lera-Ramirez <manulera14@gmail.com>",
]
documentation = "https://pydna-group.github.io/pydna"
homepage = "https://github.com/pydna-group/pydna#-pydna"
license = "BSD"
name = "pydna"
readme = "README.md"
repository = "https://github.com/pydna-group/pydna/tree/master"
version = "6.0.0-a.24.post.17+b7b559bd66"
[build-system]
build-backend = "poetry_dynamic_versioning.backend"
requires = ["poetry-core", "poetry-dynamic-versioning"]
[tool.poetry-dynamic-versioning]
enable = true
style = "semver"
vcs = "git"
[tool.poetry-dynamic-versioning.substitution]
files = ["src/pydna/__init__.py"]
[tool.pytest.ini_options]
minversion = "6.0.2"
python_files = "test_*.py"
testpaths = ["tests", "src/pydna"]
norecursedirs = ["*"]
markers = [
    "mpl_image_compare",
]

[tool.black]
include = '\.pyi?$'
line-length = 88
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.9"
