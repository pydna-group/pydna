on: [push, pull_request]

name: "Documentation Status"

permissions:
  contents: write

jobs:
  build-and-publish:
    if: "! contains(github.event.head_commit.message, '[ci skip]')"

    timeout-minutes: 10

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 🔩 Install documentation dependencies
        run: uv sync --frozen --all-extras --group docs --no-default-groups

      - name: Build documentation
        run: |
          cd docs
          uv run --frozen --no-sync sphinx-apidoc --force --implicit-namespaces --module-first -o reference ../src/pydna
          uv run --frozen --no-sync sphinx-build -n --keep-going -b html ./ ./_build/

      - name: Deploy to GitHub pages 🚀
        # Deploy only when master changes
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4.6.0
        with:
          clean: false
          branch: gh-pages
          folder: docs/_build
